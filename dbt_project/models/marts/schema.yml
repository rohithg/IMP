version: 2

models:
  - name: fct_daily_revenue
    description: Daily revenue grain used by the Finance semantic layer
    columns:
      - name: metric_date
        tests: [not_null]
      - name: customer_id
        tests: [not_null]
  - name: dim_customer
    columns:
      - name: customer_id
        tests: [unique, not_null]
